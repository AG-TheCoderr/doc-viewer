<!DOCTYPE html>
<html>
<head>
    <title>PDF Icon</title>
    <style>
        .pdf-icon {
            width: 50px;
            height: 50px;
            background: #f40f02;
            border-radius: 5px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }
        
        .pdf-icon::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: #d40d04;
            border-radius: 5px 5px 0 0;
        }
        
        .pdf-icon span {
            position: relative;
            z-index: 1;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="pdf-icon">
        <span>PDF</span>
    </div>
</body>
</html>
