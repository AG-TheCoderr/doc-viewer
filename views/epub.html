<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPUB Viewer</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #viewer { position: fixed; inset: 0; }
    #toolbar { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; z-index: 10; }
    button { padding: 6px 10px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="prev">Prev</button>
    <button id="next">Next</button>
  </div>
  <div id="viewer"></div>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3/dist/epub.js"></script>
  <script>
    const urlParams = new URLSearchParams(location.search);
    const url = urlParams.get('url');
    if (!url) { document.body.textContent = 'Missing url'; throw new Error('missing url'); }

    const book = ePub(url);
    const rendition = book.renderTo("viewer", { width: "100%", height: "100%" });
    rendition.display();

    document.getElementById('prev').onclick = () => rendition.prev();
    document.getElementById('next').onclick = () => rendition.next();
  </script>
</body>
</html>
