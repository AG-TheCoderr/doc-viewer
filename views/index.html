<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Viewer</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 1rem; }
    input[type=file] { display: block; margin: 1rem 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .card h4 { margin: 0 0 8px; font-size: 14px; word-break: break-all; }
    .error { color: #b00020; margin-top: 8px; }
    .hint { color: #555; font-size: 0.9em; }
    button { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: #f6f6f6; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Document Viewer</h1>
  <p class="hint">Upload: .docm, .dotx, .dotm, .wps, .xml, .pages, .xps, .mobi, .epub, .docx, .doc, .pdf, .rtf, .txt, .odt (converted locally to PDF/EPUB)</p>
    </header>

    <input id="file" type="file" />
    <button id="uploadBtn">Upload & View</button>
    <div id="error" class="error"></div>

    <section>
      <h3>Recent uploads</h3>
      <div id="cards" class="cards"></div>
    </section>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const uploadBtn = document.getElementById('uploadBtn');
    const cards = document.getElementById('cards');
    const errorEl = document.getElementById('error');

    function addCard(item) {
      const div = document.createElement('div');
      div.className = 'card';
      const viewUrl = item.type === 'pdf' ? `/view/pdf?url=${encodeURIComponent(item.url)}` : `/view/epub?url=${encodeURIComponent(item.url)}`;
      div.innerHTML = `
        <h4>${item.name}</h4>
        <div>Type: ${item.type.toUpperCase()}</div>
        <a href="${viewUrl}" target="_blank"><button>Open</button></a>
      `;
      cards.prepend(div);
    }

    uploadBtn.addEventListener('click', async () => {
      errorEl.textContent = '';
      if (!fileInput.files.length) { errorEl.textContent = 'Choose a file first.'; return; }
      const data = new FormData();
      data.append('file', fileInput.files[0]);
      try {
        const res = await fetch('/upload', { method: 'POST', body: data });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Upload failed');
        addCard(json);
      } catch (e) {
        console.error('Upload error:', e);
        errorEl.textContent = 'Error: ' + (e.message || 'Failed to upload file');
      }
    });
  </script>
</body>
</html>
